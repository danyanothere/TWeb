<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Футбольный стиль Joga Bonito. Купите бутсы и экипировку для игры красиво!">
    <title>Nike Mercurial Superfly - Joga Bonito</title>
    <link rel="icon" type="image/x-icon" href="brazil-flag.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* Анимация для кнопки */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .buy-now.added {
            animation: bounce 0.5s;
        }
    </style>
</head>
<body>
    <header>
        <a href="main.html" class="logo">Joga Bonito</a>
        <nav>
            <ul class="nav-center">
                <li><a href="#">New</a></li>
                <li><a href="#">Men</a></li>
                <li><a href="#">Kids</a></li>
                <li><a href="#">Sale</a></li>
            </ul>

            <ul class="nav-right">
                <li><a href="about-us.html">About us</a></li>
                <li><a href="find-store.html">Find a store</a></li>
                <li id="cartLink"><a href="cart.html">Cart <span id="cartCount"></span></a></li>
                <li id="authLink"><a href="#" id="logoutButton">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="product-page">
        <h1>Nike Mercurial Superfly</h1>
        <div class="gallery">
            <img id="main-image" src="boots1.jpg" alt="Nike Mercurial Superfly">
            <div class="thumbnails">
                <img src="boots1.jpg" alt="Nike Mercurial Superfly" onclick="changeImage(this)">
                <img src="boots2.jpg" alt="Nike Mercurial Superfly" onclick="changeImage(this)">
                <img src="boots3.jpg" alt="Nike Mercurial Superfly" onclick="changeImage(this)">
            </div>
        </div>

        <div class="price">$250</div>

        <select id="size">
            <option value="40">Size 40</option>
            <option value="41">Size 41</option>
            <option value="42">Size 42</option>
            <option value="43">Size 43</option>
        </select>

        <button class="buy-now" onclick="addToCart()">Add to Cart</button>
    </main>

    <footer>
        <p>© 2025 Joga Bonito. Все права защищены.</p>
        <ul class="social-links">
            <li><a href="#"><img src="inst.png" alt="Instagram" class="social-icon"></a></li>
            <li><a href="#"><img src="twitter.png" alt="Twitter" class="social-icon"></a></li>
            <li><a href="#"><img src="telegram.png" alt="Telegram" class="social-icon"></a></li>
        </ul>
    </footer>

    <script>
        // Функция для смены изображения
        function changeImage(img) {
            document.getElementById('main-image').src = img.src;
        }

        // Функция для добавления товара в корзину
        function addToCart() {
            const product = {
                name: "Nike Mercurial Superfly",
                price: 250,
                image: "boots1.jpg",
                size: document.getElementById('size').value,
                quantity: 1
            };

            // Получаем текущую корзину из localStorage
            const cart = JSON.parse(localStorage.getItem('cart')) || [];

            // Проверяем, есть ли уже такой товар в корзине
            const existingProduct = cart.find(item => item.name === product.name && item.size === product.size);
            if (existingProduct) {
                existingProduct.quantity += 1; // Увеличиваем количество
            } else {
                cart.push(product); // Добавляем новый товар
            }

            // Сохраняем корзину в localStorage
            localStorage.setItem('cart', JSON.stringify(cart));

            // Анимация кнопки
            const addToCartButton = document.querySelector('.buy-now');
            addToCartButton.classList.add('added');
            setTimeout(() => addToCartButton.classList.remove('added'), 500);

            // Обновляем счётчик корзины
            updateCartCount();

            alert("Product added to cart!");
        }

        // Функция для обновления счётчика корзины
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCount = document.getElementById('cartCount');

            if (cart.length > 0) {
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                cartCount.textContent = `(${totalItems})`;
            } else {
                cartCount.textContent = '';
            }
        }

        // Обновляем счётчик при загрузке страницы
        document.addEventListener('DOMContentLoaded', updateCartCount);
    </script>
</body>
</html>
