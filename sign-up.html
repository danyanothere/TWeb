<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Joga Bonito</title>
    <link rel="icon" type="image/x-icon" href="brazil-flag.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="signup.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            background-image: url('photo-1431324155629-1a6deb1dec8d.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
        }

        .signup-container h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            margin-bottom: 20px;
            color: #ff0099;
        }

        .signup-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #fff;
            text-align: left;
            width: 90%;
            margin: 0 auto 5px;
        }

        .signup-container input,
        .signup-container select {
            width: 90%;
            padding: 10px;
            margin: 0 auto 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: 'Montserrat', sans-serif;
            background-color: #333;
            color: #fff;
            display: block;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            cursor: pointer;
        }

        .signup-container select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .signup-container button {
            width: 50%;
            padding: 10px;
            background-color: #ff0099;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 auto;
        }

        .signup-container button:hover {
            background-color: #ff0066;
        }

        .signup-container p {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #fff;
            margin-top: 20px;
        }

        .signup-container a {
            color: #ff0099;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .signup-container a:hover {
            color: #ff0066;
            text-decoration: underline;
        }

        #step2 {
            display: none;
        }
    </style>
</head>
<body>
   
<div class="signup-container" id="step1">
    <h2>Sign Up</h2>
    <form id="emailForm">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password">

        <button type="submit">Continue</button>
    </form>
    <p>Already have an account? <a href="signin.html">Sign In</a></p>
</div>

    
    <div class="signup-container" id="step2">
        <h2>Complete Your Profile</h2>
        <form id="signupForm">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required placeholder="Enter your first name">

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required placeholder="Enter your last name">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="" disabled selected>Select your country</option>
            </select>

            <label for="city">City:</label>
            <select id="city" name="city" required disabled>
                <option value="" disabled selected>Select your city</option>
            </select>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required placeholder="Enter your address">

            <button type="submit">Sign Up</button>
        </form>
    </div>
    <script src="signup.js"></script>
    <script src="userlog.js"></script>
