<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Футбольный стиль Joga Bonito. Купите бутсы и экипировку для игры красиво!">
    <title>Joga Bonito</title>
    <link rel="icon" type="image/x-icon" href="brazil-flag.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <header>
        <a href="main.html" class="logo">Joga Bonito</a>
        <nav>
            <ul class="nav-center">
                <li><a href="#">New</a></li>
                <li><a href="#">Men</a></li>
                <li><a href="#">Kids</a></li>
                <li><a href="#">Sale</a></li>
            </ul>

            <ul class="nav-right">
                <li><a href="about-us.html">About us</a></li>
                <li><a href="find-store.html">Find a store</a></li>
                <li id="cartLink"><a href="cart.html">Cart <span id="cartCount"></span></a></li>
                <li id="authLink"><a href="#" id="logoutButton">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="cart-main">
        <h1 class="cart-title">Your Cart</h1>
        <p class="cart-subtitle">Here are the items you've added to your cart.</p>

        
        <div class="cart-items" id="cartItems">
        
        </div>

        
        <div class="cart-total">
            <span class="cart-total-label">Total:</span>
            <span class="cart-total-price" id="cartTotal">$0</span>
        </div>

        <!-- Кнопки действий -->
        <div class="cart-actions">
            <button class="cart-action-button" onclick="clearCart()">Clear Cart</button>
            <button class="cart-action-button" onclick="checkout()">Checkout</button>
        </div>
    </main>

    <footer>
        <p>© 2025 Joga Bonito. Все права защищены.</p>
        <ul class="social-links">
            <li><a href="#"><img src="inst.png" alt="Instagram" class="social-icon"></a></li>
            <li><a href="#"><img src="twitter.png" alt="Twitter" class="social-icon"></a></li>
            <li><a href="#"><img src="telegram.png" alt="Telegram" class="social-icon"></a></li>
        </ul>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
